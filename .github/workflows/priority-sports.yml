name: Inspect priority sports sources
on:
  push:
    branches: ['main']
    paths: ['scripts/probe-priority-sports.py', '.github/workflows/priority-sports.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SE_AVOID_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-collector.txt
      - run: python scripts/probe-priority-sports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formiq-priority-source-inspection
          path: .edgeform-state/priority-sports/
          retention-days: 7
