name: Validate FormIQ engine
on:
  push:
    paths: ['worker/**', 'scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/research.test.mjs
      - run: node tests/forecast.test.mjs
      - run: node tests/ticket-audit.test.mjs
      - run: node tests/pipeline.test.mjs
      - run: node tests/fixture-odds-linker.test.mjs
      - run: node tests/market-observations.test.mjs
      - run: node tests/sync-batches.test.mjs
      - run: node tests/priority-sport-audit.test.mjs
      - run: node tests/forward-validation.test.mjs
      - run: node tests/forward-api.test.mjs
      - run: node tests/research-supplements.test.mjs
      - run: python tests/public_odds_test.py
      - run: bash scripts/build.sh && node scripts/validate-artifact.mjs
