name: Test public bookmaker odds collection
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum public match pages (1–10)'
        default: '6'
        required: true
permissions:
  contents: read
concurrency:
  group: edgeform-public-odds
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SE_AVOID_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-collector.txt
      - run: python tests/public_odds_test.py
      - name: Collect a bounded public odds sample
        env:
          MATCH_LIMIT: ${{ inputs.limit }}
        run: python scripts/collect-public-odds.py --limit "$MATCH_LIMIT" --out .edgeform-state/public-odds/observations.json
      - name: Preserve observations or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formiq-public-odds
          path: .edgeform-state/public-odds/
          if-no-files-found: warn
          retention-days: 7
