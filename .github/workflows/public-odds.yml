name: Collect public bookmaker odds
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/public-odds.yml'
      - 'scripts/collect-public-odds.py'
      - 'scripts/public_odds_parser.py'
      - 'scripts/archive-public-odds.py'
      - 'requirements-collector.txt'
  schedule:
    - cron: '27 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum public match pages (1–10)'
        default: '6'
        required: true
permissions:
  contents: write
concurrency:
  group: edgeform-public-odds
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SE_AVOID_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-collector.txt
      - run: python tests/public_odds_test.py
      - name: Collect a bounded public odds sample
        env:
          MATCH_LIMIT: ${{ inputs.limit || '6' }}
        run: python scripts/collect-public-odds.py --limit "$MATCH_LIMIT" --out .edgeform-state/public-odds/observations.json
      - name: Retain research-only observations
        run: |
          python scripts/archive-public-odds.py .edgeform-state/public-odds/observations.json
          node scripts/merge-research-supplements.mjs
          node scripts/link-public-odds.mjs
          node scripts/export-sync-batches.mjs
          node scripts/archive-forward-validation.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/snapshot/picks.json research/snapshot/bookmaker-observations.json research/snapshot/market-observations.json research/snapshot/sync research/snapshot/forward-validation.json research/snapshot/forward-ledger research/odds-history
          if ! git diff --cached --quiet; then
            git commit -m 'Archive timestamped public bookmaker observations'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve observations or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formiq-public-odds
          path: .edgeform-state/public-odds/
          if-no-files-found: warn
          retention-days: 7
