name: Inspect Nigeria bookmaker rules
on:
  push:
    branches: ['main']
    paths: ['scripts/inspect-bookmaker-rules.py', '.github/workflows/rule-inspection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SE_AVOID_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-collector.txt
      - run: python scripts/inspect-bookmaker-rules.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formiq-nigeria-rule-inspection
          path: .edgeform-state/rule-inspection/
          retention-days: 30
